# snapcraft.yaml — BeadsViewer Snap package, following the Nextpad++ app's
# recipe (see its header for the build/publish runbook: build locally with
# `snapcraft pack --destructive-mode` from a staged copy — NEVER
# remote-build — test with `snap install --dangerous`, publish to edge).
name: beadsviewer
title: BeadsViewer
summary: Viewer for the Beads (bd) issue tracker
description: |
  Standalone desktop viewer for Beads (https://github.com/gastownhall/beads)
  projects. Dashboard, Insights, Activity, Kanban board and a 3D dependency
  graph; binds local projects (beads >= 1.3 Dolt workspaces or issues.jsonl,
  live via the bd CLI when installed) and remote repositories read-only over
  HTTP(S) — GitHub, self-hosted Gitea/Forgejo, raw URLs — with access
  tokens kept in the keyring. One window per project; editing requires the
  separately installed bd CLI.
license: GPL-3.0
website: https://github.com/nextpad-plus-plus-plugins/NppBeads.linux
issues: https://github.com/nextpad-plus-plus-plugins/NppBeads.linux/issues
grade: stable
confinement: strict
base: core24
adopt-info: beadsviewer      # version read from CMakeLists.txt below

platforms:
  amd64:
  arm64:

# Own our GApplication id on the session bus (single instance + the dock's
# New Window D-Bus activation) — same pattern as the app's dbus-nextpad slot.
slots:
  dbus-beadsviewer:
    interface: dbus
    bus: session
    name: org.nextpadplusplus.BeadsViewer

parts:
  beadsviewer:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - cmake
      - pkg-config
      - libwebkitgtk-6.0-dev
      - libjson-glib-dev
      - libsoup-3.0-dev
      - libsecret-1-dev
    stage-packages:
      # The gnome extension's platform snap supplies GTK4/libadwaita/soup3;
      # stage what it lacks: the WebKitGTK 6 stack and libsecret.
      - libwebkitgtk-6.0-4
      - libjson-glib-1.0-0
      - libsecret-1-0
    override-build: |
      craftctl set version="$(sed -n 's/^project(NppBeads VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
      MEM_MB=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)
      JOBS=$(nproc); CAP=$(( MEM_MB / 500 )); [ "$CAP" -lt 1 ] && CAP=1
      [ "$JOBS" -gt "$CAP" ] && JOBS=$CAP
      cmake -B build-snap -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
      cmake --build build-snap -j"$JOBS" --target BeadsViewer
      DESTDIR="$CRAFT_PART_INSTALL" cmake --install build-snap --component app
      # A bare Icon=name resolves only against the HOST theme — point it
      # into the snap (same fix as the app's recipe).
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/org.nextpadplusplus.BeadsViewer.png|' \
          "$CRAFT_PART_INSTALL/usr/share/applications/org.nextpadplusplus.BeadsViewer.desktop"

apps:
  beadsviewer:
    command: usr/bin/BeadsViewer
    common-id: org.nextpadplusplus.BeadsViewer
    desktop: usr/share/applications/org.nextpadplusplus.BeadsViewer.desktop
    extensions: [gnome]
    plugs:
      - home
      - network            # remote read-only mode + any provider-synced area
      - removable-media
      - gsettings
      - password-manager-service   # libsecret → Secret Service keyring
    environment:
      # WebKit's bubblewrap sandbox cannot nest inside the snap sandbox.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
